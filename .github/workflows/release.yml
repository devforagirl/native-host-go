name: Release Native Host

on:
  push:
    tags:
      - 'v*'

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'
      - name: Build Binary
        run: go build -ldflags="-s -w" -o flowmeter-host.exe .
      - name: Rename Asset
        shell: bash
        run: |
          VERSION=${GITHUB_REF#refs/tags/}
          mv flowmeter-host.exe "FlowMeter-NativeHost-Windows-x64-${VERSION}.exe"
      - name: Upload Asset
        uses: softprops/action-gh-release@v2
        with:
          files: FlowMeter-NativeHost-Windows-x64-*.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-macos:
    strategy:
      matrix:
        include:
          - os: macos-latest
            arch: amd64
            name: x64
          - os: macos-latest
            arch: arm64
            name: arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'
      - name: Build Binary
        run: |
          GOOS=darwin GOARCH=${{ matrix.arch }} go build -ldflags="-s -w" -o flowmeter-host .
      - name: Create App Bundle
        run: |
          mkdir -p FlowMeterHost.app/Contents/MacOS
          cp flowmeter-host FlowMeterHost.app/Contents/MacOS/flowmeter-host

          cat <<EOF > FlowMeterHost.app/Contents/Info.plist
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>CFBundleExecutable</key>
              <string>flowmeter-host</string>
              <key>CFBundleIdentifier</key>
              <string>com.flowmeter.host</string>
              <key>CFBundleName</key>
              <string>FlowMeter Host</string>
              <key>CFBundlePackageType</key>
              <string>APPL</string>
              <key>CFBundleShortVersionString</key>
              <string>\${{ github.ref_name }}</string>
              <key>LSMinimumSystemVersion</key>
              <string>10.13</string>
          </dict>
          </plist>
          EOF
      - name: Create DMG
        run: |
          VERSION=${GITHUB_REF#refs/tags/}
          DMG_NAME="FlowMeter-NativeHost-macOS-${{ matrix.name }}-${VERSION}.dmg"
          hdiutil create -volname "FlowMeter Host" -srcfolder FlowMeterHost.app -ov -format UDZO "$DMG_NAME"
      - name: Upload Asset
        uses: softprops/action-gh-release@v2
        with:
          files: FlowMeter-NativeHost-macOS-*.dmg
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
